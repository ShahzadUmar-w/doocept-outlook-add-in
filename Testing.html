<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Doccept Upload Test</title>
</head>
<body>
  <h3>Doccept Insert Document Test</h3>

  <input type="file" id="fileInput" />
  <br /><br />
  <button onclick="uploadFile()">Upload Document</button>

  <pre id="output"></pre>

  <script>
    async function uploadFile() {
      const output = document.getElementById("output");
      const fileInput = document.getElementById("fileInput");

      if (!fileInput.files.length) {
        alert("Select file first");
        return;
      }

      const file = fileInput.files[0];
      output.innerText = "Uploading...\n";

      // ===== FORM DATA EXACT DOCCEPT INSERT API =====
      const formData = new FormData();
      formData.append("file", file); // required
      formData.append("docPath", "/root/add-in data/emails"); // destination folder
      formData.append("docUuid", "3b3238ae-a2e3-4237-9ad4-d33fe7fedee6"); // leave blank for new upload

      formData.append("comment", "Uploaded from API Test");
      formData.append("importZip", "false");
      formData.append("extractText", "false");
      formData.append("slctdCategory", "");
      formData.append("notifyChecked", "false");
      formData.append("notifyUsers", "");
      formData.append("roles", "ADMIN");
      formData.append("message", "");

      // ===== BASIC AUTH =====
      const username = "pluginaccess";
      const password = "test123";
      const base64 = btoa(`${username}:${password}`);

      try {
        const resp = await fetch(
          "https://docceptdemo.com/doccept/services/rest/uploadService/insert",
          {
            method: "POST",
            headers: {
              Authorization: `Basic ${base64}`
              // DO NOT set Content-Type manually
            },
            body: formData,
            credentials: "include"
          }
        );

        const resultText = await resp.text();

        if (!resp.ok) {
          throw new Error(`Upload failed ${resp.status}\n${resultText}`);
        }

        console.log("Upload success:", resultText);
        output.innerText = "SUCCESS RESPONSE:\n" + resultText;

      } catch (err) {
        console.error(err);
        output.innerText = "ERROR:\n" + err.message;
      }
    }
  </script>
</body>
</html>
