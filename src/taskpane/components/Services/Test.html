<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="loginUser('demoaccess', 'test123');">login</button>
</body>
<script>
 async function loginUser(username, password) {
        try {
            // Prepare the request body as JSON
            const loginData = {
                username: username,
                password: password
            };
    
            // Make the API call
            const response = await fetch("https://docceptdemo.com/doccept/#/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json", // Set the correct content type
                    "Accept": "application/json" // Ensure the response is JSON
                },
                body: JSON.stringify(loginData) // Convert the data to JSON string
            });
    
            // Check if the response is successful
            if (!response.ok) {
                if (response.status === 401) {
                    throw new Error("Authorization failed");
                } else if (response.status === 409) {
                    // Handle case where user is already logged in
                    console.warn("User is already logged in, redirecting to home...");
                    // setTimeout(() => {
                    //     // setOpen(true);
                    //     // navigate('/home');
                    // }, 3000);
                    return; // Exit the function after handling 409
                } else {
                    throw new Error(`Error accessing the repository: ${response.statusText}`);
                }
            }
    
            // Parse the response
            const data = await response.json();
            console.log("Authorization token:", data.token);
    
            // Navigate to home page after successful login
            // setTimeout(() => {
            //     setOpen(true);
            //     navigate('/home');
            // }, 3000);
    
        } catch (error) {
            console.error("Error during login:", error.message);
            //------------- Optionally, display an error message to the user--------------//
           
        }
    }
</script>
</html>
